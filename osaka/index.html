    <p class="eyebrow">JUST FOR OUR FAMILY</p>
    <h1>우리 가족의<br>여행 안내.</h1>
    <p>가족용 암호를 입력하면<br>일정과 지도, 이동 안내가 열려요.</p>
    <form id="unlock-form" class="panel">
      <label for="family-code">가족용 암호</label>
      <input class="code-input" id="family-code" name="password" type="password" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="current-password" autocapitalize="characters" autocorrect="off" spellcheck="false" required maxlength="40" aria-describedby="unlock-error">
      <label class="show"><input id="show-code" type="checkbox">암호 보이기</label>
      <button class="submit" id="unlock-submit" type="submit">여행 안내 열기 →</button>
      <p id="unlock-error" class="error" role="alert" hidden></p>
      <p class="small">암호는 가족에게 받은 메시지를 확인하세요.<br>대소문자·띄어쓰기·하이픈은 상관없어요.</p>
    </form>
    <noscript><p>여행 안내를 열려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
    <div class="footer">가족용 암호가 있어야 내용을 볼 수 있어요.</div>

  <script>
    (()=>{
      'use strict';
      const familyPayload=JSON.parse(document.getElementById('encrypted-trip').textContent);
      const form=document.getElementById('unlock-form');
      const input=document.getElementById('family-code');
      const submit=document.getElementById('unlock-submit');
      const error=document.getElementById('unlock-error');
      const bytes=base64=>Uint8Array.from(atob(base64),c=>c.charCodeAt(0));
      document.getElementById('show-code').addEventListener('change',e=>input.type=e.target.checked?'text':'password');
      form.addEventListener('submit',async e=>{
        e.preventDefault();error.hidden=true;
        if(!window.crypto?.subtle){error.textContent='Safari나 Chrome에서 HTTPS 주소로 열어 주세요.';error.hidden=false;return}
        const normalized=input.value.toUpperCase().replace(/[\s-]/g,'');
        if(!normalized){input.focus();return}
        submit.disabled=true;submit.textContent='여행 안내를 여는 중…';
        try{
          const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(normalized),'PBKDF2',false,['deriveKey']);
          const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(familyPayload.salt),iterations:familyPayload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
          const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(familyPayload.iv),additionalData:new TextEncoder().encode('family-trip-v1'),tagLength:128},key,bytes(familyPayload.ciphertext));
          const page=new TextDecoder('utf-8',{fatal:true}).decode(plaintext);
          if(!page.startsWith('<!doctype html>'))throw new Error('invalid data');
          input.value='';document.open();document.write(page);document.close();
        }catch{
          error.textContent='암호가 맞지 않아요. 가족에게 받은 암호를 다시 확인해 주세요.';
          error.hidden=false;input.focus();submit.disabled=false;submit.textContent='여행 안내 열기 →';
        }
      });
    })();
  </script>
