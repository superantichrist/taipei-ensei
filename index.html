<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>你好台北 — 대만 원정 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --peach:#FF94A6;--peach-soft:#FFDDE3;--peach-bg:#FFF2F4;
  --taro:#B79CEB;--taro-soft:#EEE6FF;--mint:#6FCDB8;--mint-soft:#D9F4EC;
  --tea:#C99D74;--tea-soft:#F7ECDF;--sky:#8EC9FF;--sky-soft:#E1F0FF;--gold:#FFC864;
  --text:#4A3B45;--sub:#9C8A94;--line:#F2E3E6;--card:#fff;
  --shadow:0 8px 24px rgba(200,130,145,.16);--r:22px;--ok:#46BF9C;--no:#FF7E9D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Gowun Dodum','Noto Sans TC',sans-serif;color:var(--text);background:#FFF9F3;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:
  radial-gradient(420px 320px at 88% -6%,#E3F6EF 0%,transparent 70%),
  radial-gradient(520px 380px at -10% 18%,#FFE2E8 0%,transparent 70%),
  radial-gradient(420px 420px at 110% 78%,#EFE7FF 0%,transparent 70%),#FFF9F3}
.zh{font-family:'Noto Sans TC','Gowun Dodum',sans-serif}
.py{color:#8C6FD6;font-size:.88rem;letter-spacing:.2px}
.hg{color:#E0708A;font-weight:700}
#app{max-width:520px;margin:0 auto;padding:20px 18px 112px;min-height:100vh}
.hide{display:none!important}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,var(--peach),var(--taro));color:#fff;font-size:1.02rem;font-weight:700;
  padding:15px 22px;border-radius:18px;width:100%;box-shadow:0 6px 18px rgba(255,148,166,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:#E0708A;box-shadow:none;border:2px solid var(--peach-soft)}
.btn.mini{width:auto;padding:9px 16px;font-size:.85rem;border-radius:14px}
.btn.mint{background:linear-gradient(135deg,var(--mint),var(--sky))}
.row2{display:flex;gap:10px;margin-top:10px}.row2 .btn{flex:1;font-size:.9rem;padding:13px 10px}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--taro-soft);color:#7C5CD6}
.tag.pink{background:var(--peach-soft);color:#E0587A}.tag.mint{background:var(--mint-soft);color:#2A9C80}
.tag.sky{background:var(--sky-soft);color:#3D87D6}.tag.gold{background:#FFF1D6;color:#C98520}
.small{font-size:.8rem;color:var(--sub)}
.h2{font-size:1.08rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:1.3rem;font-weight:700}
.logo .zh{background:linear-gradient(90deg,var(--peach),var(--taro));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:.7rem;color:var(--sub);font-weight:400;margin-top:1px}
.xp-pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:7px 13px;box-shadow:var(--shadow);font-size:.78rem;font-weight:700;color:#C98520}
/* home */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#FFE7EC 0%,#EFE7FF 55%,#DDF4EC 100%)}
.hero-row{display:flex;align-items:center;gap:16px}
.gauge{position:relative;width:118px;height:118px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gauge .val b{font-size:1.45rem;color:#E0587A}.gauge .val span{font-size:.64rem;color:var(--sub)}
.dd-label{font-size:.78rem;color:var(--sub)}
.dd-num{font-size:2.3rem;font-weight:700;color:#7C5CD6;line-height:1.1}
.hero p{font-size:.8rem;color:#7d6a75;line-height:1.55;margin-top:12px}
.today-line{display:flex;gap:10px;margin:14px 0}
.stat-chip{flex:1;background:#fff;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-chip b{display:block;font-size:1.1rem}.stat-chip span{font-size:.68rem;color:var(--sub)}
.quick{display:flex;gap:10px;margin-top:10px}
.quick button{flex:1;border:none;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px 8px;font-family:inherit;cursor:pointer;color:var(--text);font-weight:700;font-size:.88rem}
.quick button span{display:block;font-size:1.5rem;margin-bottom:4px}
.daily{margin-top:14px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.track-list{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.track-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.track-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex:none}
.track-row .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.track-row .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--peach),var(--taro))}
.t-body{flex:1}.t-name{font-size:.86rem;font-weight:700}.t-sub{font-size:.7rem;color:var(--sub)}
details.memo{margin-top:14px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
details.memo summary{cursor:pointer;font-weight:700;font-size:.92rem;list-style:none}
details.memo summary::-webkit-details-marker{display:none}
details.memo ul{margin:10px 0 0 18px;font-size:.82rem;line-height:1.65}
details.memo li{margin-bottom:6px}
details.memo .src{font-size:.68rem;color:var(--sub);margin-top:10px;line-height:1.6;word-break:break-all}
details.memo .src a{color:#8C6FD6}
/* session */
.ses-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ses-close{width:38px;height:38px;border-radius:13px;background:#fff;border:none;box-shadow:var(--shadow);font-size:1rem;cursor:pointer;color:var(--sub)}
.ses-bar{flex:1;height:12px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.05)}
.ses-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--peach),var(--taro));transition:width .35s}
.q-card{min-height:340px;display:flex;flex-direction:column}
.q-kind{margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.q-word{text-align:center;margin:10px 0 6px}
.q-word .main{font-size:2rem;font-weight:700;line-height:1.35}
.big-hg{font-size:1.15rem;margin-top:6px}
.kr-mean{font-size:1.02rem;margin-top:6px}
.kr-big{font-size:1.45rem;font-weight:700;line-height:1.4}
.q-prompt{text-align:center;font-size:.84rem;color:var(--sub);margin:12px 0}
.spk-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.speak-btn{border:none;background:var(--sky-soft);color:#3D87D6;border-radius:999px;padding:7px 15px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;gap:5px;align-items:center}
.speak-btn.sm{padding:6px 11px}
.speak-btn.center{display:flex;margin:6px auto 0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px 15px;font-family:inherit;font-size:.98rem;color:var(--text);cursor:pointer;text-align:left;transition:all .12s;line-height:1.45}
.opt:active{transform:scale(.98)}
.opt.sel-ok,.opt.reveal{border-color:var(--ok);background:#EBFAF4}
.opt.sel-no{border-color:var(--no);background:#FFF0F4;animation:shake .3s}
.py-opt{font-size:1.05rem;color:#6B4FC4;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.listen-zone{display:flex;flex-direction:column;align-items:center;gap:10px;margin:14px 0 4px}
.big-speak{width:92px;height:92px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--sky),var(--taro));color:#fff;font-size:2.2rem;cursor:pointer;box-shadow:0 8px 22px rgba(142,201,255,.45)}
.big-speak:active{transform:scale(.94)}
.hint-box{margin-top:10px;background:var(--peach-bg);border-radius:14px;padding:12px;text-align:center}
.fb{border-radius:18px;padding:16px;margin-top:16px;animation:pop .25s}
.fb.ok{background:#EBFAF4;border:2px solid #BDEBD9}.fb.no{background:#FFF0F4;border:2px solid #FFD3DF}
.fb h3{font-size:.95rem;margin-bottom:8px}.fb.ok h3{color:#1F8A6C}.fb.no h3{color:#E0587A}
.fb-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbz{font-size:1.25rem;font-weight:700}
.tip{margin-top:9px;background:#FFF7EA;border-radius:12px;padding:10px 12px;font-size:.8rem;color:#A8752A;line-height:1.55}
.tip b{color:#C98520}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.intro-box{text-align:center;padding:4px 0}
.badge-new{font-size:.7rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--gold),#FF9F6E);padding:4px 12px;border-radius:999px}
.intro-tip{margin-top:12px;background:#FFF7EA;border-radius:16px;padding:12px 14px;text-align:left;font-size:.82rem;color:#A8752A;line-height:1.6}
.intro-tip b{color:#C98520}
.intro-ex{margin-top:12px;background:var(--peach-bg);border-radius:16px;padding:12px;text-align:center}
.mic-zone{text-align:center;margin-top:auto;padding-top:14px}
.mic-btn{width:80px;height:80px;border-radius:50%;border:none;cursor:pointer;font-size:1.9rem;background:linear-gradient(135deg,var(--peach),var(--taro));box-shadow:0 8px 24px rgba(255,148,166,.4);color:#fff}
.mic-btn.sm{width:60px;height:60px;font-size:1.4rem}
.mic-btn:active{transform:scale(.93)}
.mic-btn.listening{animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,148,166,.55)}50%{box-shadow:0 0 0 18px rgba(255,148,166,0)}}
.rec-out{margin-top:10px;border-radius:14px;padding:11px 13px;background:#fff;border:2px solid var(--line);font-size:.86rem;text-align:left;animation:pop .25s}
.rec-out .heard{font-weight:700;font-size:1.05rem}
.sim-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.sim-bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.mic-skip{margin:12px auto 0;background:none;border:none;color:var(--sub);font-size:.76rem;text-decoration:underline;cursor:pointer;font-family:inherit;display:block}
.result-wrap{text-align:center;padding-top:20px}
.result-emoji{font-size:3rem;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.result-stats{display:flex;gap:10px;margin:18px 0}
.delta-cov{background:linear-gradient(135deg,#FFE7EC,#EFE7FF);border-radius:18px;padding:15px;margin-bottom:12px}
.delta-cov b{font-size:1.25rem;color:#E0587A}
.gacha-stage{padding:18px 0 22px}
.stamp-pop{width:150px;margin:0 auto;animation:stampIn .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes stampIn{0%{transform:scale(2.2) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
/* script builder */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label{font-size:.74rem;color:var(--sub);font-weight:700;display:flex;flex-direction:column;gap:4px}
.inp{width:100%;border:2px solid var(--peach-soft);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:.92rem;outline:none;background:#fff;color:var(--text)}
.inp:focus{border-color:var(--peach)}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 11px}
.section-h h2{font-size:1rem}
.pick-sec{padding:14px 14px 8px;margin-bottom:10px}
.sec-t{font-weight:700;font-size:.88rem;margin-bottom:8px}
.line-pick{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-radius:12px;cursor:pointer;border-bottom:1px dashed var(--line)}
.line-pick:last-child{border-bottom:none}
.line-pick.on{background:var(--peach-bg)}
.line-pick input{margin-top:4px;accent-color:#E0708A;width:17px;height:17px;flex:none}
.lp-body{display:flex;flex-direction:column}
.lp-z{font-size:.95rem;font-weight:700}.lp-k{font-size:.74rem;color:var(--sub)}
.sc-line{display:flex;gap:10px;align-items:flex-start;padding:11px 4px;border-bottom:1px dashed var(--line);border-radius:12px;transition:background .2s}
.sc-line:last-child{border-bottom:none}
.sc-line.now{background:#FFF1D6}
.sc-no{width:24px;height:24px;border-radius:50%;background:var(--taro-soft);color:#7C5CD6;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.sc-b{flex:1}.sc-h{font-size:1.02rem}.sc-z{font-size:.98rem;font-weight:700;margin-top:2px}
/* fullscreen */
.cue,.showfull{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  background:linear-gradient(160deg,#FFE7EC 0%,#EFE7FF 55%,#DDF4EC 100%)}
.cue-top{display:flex;justify-content:space-between;align-items:center}
.cue-x{width:42px;height:42px;border-radius:14px;border:none;background:#fff;font-size:1.1rem;cursor:pointer;color:var(--sub)}
.cue-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px;max-width:640px;margin:0 auto;width:100%}
.cue-h{font-size:2.1rem;font-weight:700;color:#E0587A;line-height:1.35;word-break:keep-all}
.cue-z{font-size:1.7rem;font-weight:700;line-height:1.4}
.cue-p{font-size:1.02rem;color:#8C6FD6}
.cue-k{font-size:.95rem;color:#7d6a75}
.cue-ctrl{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px}
.cue-b{width:52px;height:52px;border-radius:16px;border:none;background:#fff;font-size:1.25rem;cursor:pointer;box-shadow:var(--shadow)}
#cueRec{max-width:480px;margin:0 auto;width:100%}
.showfull{justify-content:center;align-items:center;text-align:center;cursor:pointer}
.sf-z{font-size:2.5rem;font-weight:700;line-height:1.45;color:#4A3B45;word-break:keep-all}
.sf-k{font-size:1rem;color:#7d6a75;margin-top:16px}
.sf-ctrl{display:flex;gap:12px;margin-top:26px}
.sf-hint{position:absolute;bottom:22px;left:0;right:0;font-size:.72rem;color:var(--sub)}
.pose-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:560px;margin-top:22px}
.pose{background:#fff;border-radius:18px;padding:12px 4px;box-shadow:var(--shadow);cursor:pointer}
.pose .e{font-size:2.3rem}.pose .z{font-size:1rem;font-weight:700;margin-top:4px}.pose .k{font-size:.66rem;color:var(--sub)}
/* cards screen */
.show-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.show-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px 12px;cursor:pointer;text-align:left;border:none;font-family:inherit;color:var(--text)}
.show-card .z{font-size:.98rem;font-weight:700;line-height:1.45;white-space:pre-line}
.show-card .k{font-size:.7rem;color:var(--sub);margin-top:6px}
.show-card.wide{grid-column:span 2;background:linear-gradient(135deg,#FFF1D6,#FFE7EC)}
.hear-row{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px dashed var(--line)}
.hear-row:last-child{border-bottom:none}
.hear-row .b{flex:1}.hear-row .z{font-weight:700}
/* record */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat-box{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat-box b{font-size:1.25rem}.stat-box span{display:block;font-size:.7rem;color:var(--sub);margin-top:2px}
.lvl-card{background:linear-gradient(135deg,#FFE7EC,#EFE7FF);border-radius:18px;padding:18px}
.lvl-card .bar{height:9px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;margin-top:10px}
.lvl-card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--taro));border-radius:99px}
.stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stamp-cell{text-align:center}.stamp-cell .n{font-size:.62rem;margin-top:2px}
.stamp-cell.locked svg{filter:grayscale(1) opacity(.28)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.s-t{font-size:.9rem;font-weight:700}.s-d{font-size:.7rem;color:var(--sub);margin-top:2px}
.toggle{width:52px;height:30px;border-radius:99px;background:#EADDE3;position:relative;cursor:pointer;border:none;flex:none;transition:background .2s}
.toggle.on{background:linear-gradient(135deg,var(--peach),var(--taro))}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.toggle.on::after{left:25px}
.seg{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.seg button{border:2px solid var(--line);background:#fff;border-radius:11px;padding:7px 11px;font-family:inherit;font-weight:700;color:var(--sub);cursor:pointer;font-size:.8rem}
.seg button.on{border-color:var(--peach);color:#E0587A;background:var(--peach-bg)}
.warn{background:#FFF7EA;border-radius:14px;padding:11px 13px;font-size:.78rem;color:#A8752A;line-height:1.55;margin-bottom:10px}
/* nav & overlays */
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(480px,calc(100% - 28px));background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-radius:24px;box-shadow:0 10px 30px rgba(140,90,110,.18);display:flex;padding:8px;z-index:50}
.nav button{flex:1;border:none;background:none;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;color:#C6B3BD;font-size:.64rem;font-weight:700}
.nav button .ico{font-size:1.25rem;line-height:1}
.nav button.on{color:#E0587A;background:var(--peach-bg)}
.overlay{position:fixed;inset:0;background:rgba(74,59,69,.45);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:26px;padding:24px 20px;max-width:400px;width:100%;text-align:center;animation:pop .3s;max-height:88vh;overflow-y:auto}
.modal h2{margin-bottom:10px;font-size:1.18rem}
.modal p{font-size:.86rem;color:var(--sub);line-height:1.6;margin-bottom:16px}
.modal .btn+.btn{margin-top:10px}
.modal label{display:block;text-align:left;font-size:.76rem;color:var(--sub);font-weight:700;margin-bottom:12px}
.modal label .inp{margin-top:4px}
.onb-emoji{font-size:3rem;margin-bottom:10px;animation:floaty 3s ease-in-out infinite}
.spark{position:fixed;pointer-events:none;z-index:300;font-size:1rem;animation:sparkFly .8s ease-out forwards}
@keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#fff;border-radius:99px;padding:11px 20px;box-shadow:0 8px 24px rgba(140,90,110,.25);font-size:.84rem;font-weight:700;z-index:400;animation:toastIn .3s;max-width:92vw;text-align:center}
@keyframes toastIn{0%{transform:translate(-50%,-16px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
@media (max-width:380px){.q-word .main{font-size:1.7rem}.cue-h{font-size:1.75rem}.sf-z{font-size:2rem}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" style="display:none">
  <button data-s="home"><span class="ico">🏠</span>홈</button>
  <button data-s="script"><span class="ico">🎤</span>MC 대본</button>
  <button data-s="cards"><span class="ico">💬</span>특전회</button>
  <button data-s="rec"><span class="ico">📮</span>기록</button>
</nav>
<div id="full"></div>
<div id="ovl"></div>
<script>

function tglTrack(tr,btn){state.tracks[tr]=!state.tracks[tr];if(!Object.values(state.tracks).some(Boolean)){state.tracks[tr]=true;toast('트랙 하나는 켜 둬야 해!')}btn.classList.toggle('on',state.tracks[tr]);save()}
function editDates(){openModal('<h2>✈️ 원정 날짜</h2><p>D-day에 맞춰 하루 분량을 자동으로 짜 줄게.<br>이 기기에만 저장돼요.</p><label>출발일<input class="inp" type="date" id="dDep" value="'+esc(state.depart)+'"></label><label>첫 무대 (선택)<input class="inp" type="date" id="dShow" value="'+esc(state.show)+'"></label><button class="btn" onclick="saveDates()">저장</button><button class="btn ghost" onclick="closeModal()">취소</button>')}
function saveDates(){state.depart=document.getElementById('dDep').value||'';state.show=document.getElementById('dShow').value||'';save();closeModal();toast(state.depart?'D-day 설정 완료! 加油 💪':'날짜를 지웠어');const a=document.querySelector('.nav button.on');show(a?a.dataset.s:'home')}
function exportData(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  openModal('<h2>백업 코드</h2><p>아래 코드를 복사해서 보관해!</p><textarea class="inp" style="height:110px;font-size:.66rem" readonly onclick="this.select()">'+code+'</textarea><button class="btn" style="margin-top:12px" onclick="closeModal()">닫기</button>')}
function importData(){openModal('<h2>백업 코드 붙여넣기</h2><textarea class="inp" id="impIn" style="height:110px;font-size:.66rem" placeholder="백업 코드를 붙여넣어 줘"></textarea><button class="btn" style="margin-top:12px" onclick="doImport()">불러오기</button><button class="btn ghost" onclick="closeModal()">취소</button>')}
function doImport(){try{const obj=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('impIn').value.trim()))));if(!obj||typeof obj.cards!=='object')throw 0;
  localStorage.setItem(KEY,JSON.stringify(obj));load();save();closeModal();toast('불러오기 완료! 歡迎回來 🌸');show('home')}catch(e){toast('코드를 읽을 수 없어 😢 다시 확인해 줘')}}
function resetAll(){openModal('<h2>정말 초기화할까?</h2><p>진도·스탬프·대본·날짜가 전부 사라져.<br>되돌릴 수 없어!</p><button class="btn" style="background:linear-gradient(135deg,#FF7E9D,#FF94A6)" onclick="localStorage.removeItem(KEY);location.reload()">응, 초기화할래</button><button class="btn ghost" onclick="closeModal()">아냐, 유지할래</button>')}
/* ---------- 모달·토스트 ---------- */
function openModal(inner){$('#ovl').innerHTML='<div class="overlay"><div class="modal">'+inner+'</div></div>'}
function closeModal(){$('#ovl').innerHTML=''}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s'},2200);setTimeout(()=>t.remove(),2700)}
/* ---------- 온보딩·컴백 ---------- */
function onboarding(){openModal('<div class="onb-emoji">🧋</div><h2><span class="zh">你好台北</span>에 어서 와!</h2><p>대만 원정 무대를 위한 중국어 연습실.<br>MC·아오리·특전회 표현을 <b>하루 5분</b>씩,<br>출발일에 맞춰 딱 필요한 만큼만!</p>'
  +'<label>출발일 (선택)<input class="inp" type="date" id="obDep"></label><button class="btn" onclick="obDone()">시작하기 ♡</button>')}
function obDone(){state.depart=document.getElementById('obDep').value||'';state.onboard=true;save();closeModal();show('home')}
function comebackCheck(){const t=todayStr();if(!state.lastDate||state.cbDate===t)return;const gap=dayDiff(state.lastDate,t);if(gap<3)return;
  state.cbDate=t;const dieted=dietReviews();save();
  openModal('<div class="onb-emoji">🌸</div><h2 class="zh">歡迎回來!</h2><p class="small" style="margin-bottom:6px">(환잉 후이라이 = 돌아온 걸 환영해!)</p><p><b>'+gap+'일 만</b>이야! 쉬었던 건 전혀 잘못이 아니야.'
    +(dieted?'<br>밀린 복습 '+dieted+'장은 며칠에 나눠 뒀어 🍃':'')+'<br><br>가볍게 <b>5장만</b> 복습하면서 감부터 찾자!</p>'
    +'<button class="btn" onclick="closeModal();startSession(true)">가볍게 복습 5장 ♡</button><button class="btn ghost" onclick="closeModal()">천천히 둘러볼래</button>')}
/* ---------- init ---------- */
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.s)));
load();
show('home');
if(!state.onboard)onboarding();else comebackCheck();
/* 你好台北 v1.0 — made with ♡ */
</script>
</body>
</html>
